<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1>Stream Selection</h1>

    {% csrf_token %}
    <div class="row">
        <div class="col-md-12">
            <label for="stream">Select Stream</label>
            <select name="stream" id="stream" class="form-control" onload="showForm(this)" onchange="showForm(this)">
                <option value="anomalies" selected>Anomalies</option>
                <option value="ts_metrics">TS Metric</option>
            </select>
        </div>
    </div>

    <div class="row anomalies-form schema-form" style="display:none">
        <form method="post">
           <div class="col-md-12">
                <input type="text" name="stream_name" id="stream_name" class="form-control" value="anomlies" readonly>
           </div>
        <div class="col-md-12">
            <label for="json_schema">Json Schema</label>
            <input type="text" name="json_schema" id="json_schema" class="form-control textarea" value="ABC">
        </div>

        <div class="col-md-12">
            <label for="cursor_field">Select Cursor Field</label>
            <select name="cursor_field" id="cursor_field" class="form-control">
               <option value="x" selected>x</option>
                <option value="ts">ts</option>
            </select>
        </div>


        <div class="col-md-12">
            <input type="submit" value="Submit">

    </div>
        </form>
</div>

    <div class="row ts_metrics-form schema-form" style="display:none">
        <form method="post">
           <div class="col-md-12">
                <input type="text" name="stream_name" id="stream_name" class="form-control" value="ts_metrics" readonly>
           </div>
        <div class="col-md-12">
            <label for="json_schema">Json Schema</label>
            <input type="text" name="json_schema" id="json_schema" class="form-control textarea" value="DFFGD">
        </div>

        <div class="col-md-12">
            <label for="cursor_field">Select Cursor Field</label>
            <select name="cursor_field" id="cursor_field" class="form-control">
               <option value="m" selected>m</option>
                <option value="n">n</option>
            </select>
        </div>


        <div class="col-md-12">
            <input type="submit" value="Submit">

    </div>
        </form>
</div>



</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

<script>

    onload = function(){
        var selectedStream = $("#stream").val();
        selectedForm = selectedStream + "-form";
        $("." + selectedForm).show();
    }

    function showForm(element){
        var selected = element.value;
        form_class = selected + "-form";
        $(".schema-form").hide();
        $("." + form_class).show();
    }

</script>
